<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Teensy Reverse Shell logo</title>
  <desc id="desc">USB plug feeding a terminal prompt with a reverse-connection loop.</desc>

  <rect x="4" y="4" width="192" height="192" rx="44" fill="#101820"/>

  <!-- USB connector -->
  <g>
    <rect x="76" y="26" width="48" height="32" rx="5" fill="#CBD5E1"/>
    <rect x="84" y="34" width="32" height="16" rx="2" fill="#101820"/>
    <line x1="94" y1="34" x2="94" y2="42" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="106" y1="34" x2="106" y2="42" stroke="#CBD5E1" stroke-width="3"/>
    <!-- plug body / PCB -->
    <rect x="68" y="58" width="64" height="20" rx="5" fill="#2EE59D"/>
    <circle cx="78" cy="68" r="3" fill="#101820"/>
    <circle cx="122" cy="68" r="3" fill="#101820"/>
    <!-- pins into terminal -->
    <line x1="90" y1="78" x2="90" y2="88" stroke="#2EE59D" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="78" x2="100" y2="88" stroke="#2EE59D" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="78" x2="110" y2="88" stroke="#2EE59D" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- terminal window -->
  <rect x="30" y="88" width="140" height="84" rx="14" fill="#1B2530" stroke="#2A3544" stroke-width="3"/>
  <circle cx="46" cy="103" r="4" fill="#FF5A5F"/>
  <circle cx="60" cy="103" r="4" fill="#E8C971"/>
  <circle cx="74" cy="103" r="4" fill="#2EE59D"/>
  <line x1="30" y1="114" x2="170" y2="114" stroke="#2A3544" stroke-width="3"/>

  <!-- prompt >_ -->
  <g fill="none" stroke="#2EE59D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="52,132 66,144 52,156"/>
  </g>
  <rect x="76" y="150" width="20" height="7" rx="3.5" fill="#2EE59D">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- reverse loop arrows -->
  <g fill="none" stroke="#FF5A5F" stroke-width="7" stroke-linecap="round">
    <path d="M 118 132 A 18 18 0 0 1 152 140"/>
    <path d="M 152 132 A 18 18 0 0 1 118 148"/>
  </g>
  <polygon points="152,130 160,142 146,143" fill="#FF5A5F"/>
  <polygon points="118,158 110,146 124,145" fill="#FF5A5F"/>
</svg>
